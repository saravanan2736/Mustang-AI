[package]
name = "mustang-desktop"
version = "0.1.0"
description = "Mustang AI native Windows desktop shell (Tauri 2)"
edition = "2021"
publish = false

[lib]
name = "mustang_desktop_lib"
# Desktop-only: the template's "staticlib"/"cdylib" exist for mobile targets.
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-single-instance = "2"
# Rust-side native message boxes only (first-run import prompt); no JS permissions granted.
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
mustang-supervisor = { path = "../crates/mustang-supervisor" }
getrandom = "0.3"
sha2 = "0.10"

[features]
default = []
# Phase B connectivity probe (test-only mock backend); never part of the default build.
probe = []

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
