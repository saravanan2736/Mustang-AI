[package]
name = "mustang-desktop"
version = "0.1.0"
description = "Mustang AI native Windows desktop shell (Tauri 2)"
edition = "2021"
publish = false

[lib]
name = "mustang_desktop_lib"
# Desktop-only: the template's "staticlib"/"cdylib" exist for mobile targets.
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
# Rust-side native message boxes only (first-run import prompt); no JS permissions granted.
tauri-plugin-dialog = "2"
# Window size/position persistence (Rust-side only).
tauri-plugin-window-state = "2"
# Opening allow-listed https links in the default browser (Rust-side only, via open_external).
tauri-plugin-opener = "2"
# Opt-in signed updates and download notifications (Rust-side only; no JS permissions).
tauri-plugin-updater = "2"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
mustang-supervisor = { path = "../crates/mustang-supervisor" }
getrandom = "0.3"
sha2 = "0.10"

[target.'cfg(windows)'.dependencies]
# Session-end (logoff/shutdown) handling and keep-awake while generating or downloading.
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_Power",
    "Win32_System_Shutdown",
] }

[features]
default = []
# Phase B connectivity probe (test-only mock backend); never part of the default build.
probe = []

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
