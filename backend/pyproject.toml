[project]
name = "mustang-backend"
version = "0.1.0"
description = "Mustang AI Local Inference Backend"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "httpx>=0.27.0",
    "aiosqlite>=0.20.0",
    "psutil>=6.0.0",
    "gguf>=0.10.0",
    "sse-starlette>=2.1.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = [
    "gpu: marks tests that require actual NVIDIA GPU hardware",
]
